name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Flutter Doctor
        run: flutter doctor -v

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Restore Android signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          mkdir -p android/keystore
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/keystore/hotel-assistant-release.jks

          cat > android/key.properties <<EOF
          storeFile=keystore/hotel-assistant-release.jks
          storePassword=$ANDROID_STORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
      - name: Build APK
        run: flutter build apk --release

      - name: Read Version
        id: version
        shell: bash
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //')
          NAME="${VERSION%%+*}"
          BUILD="${VERSION##*+}"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"

          echo "Version: $NAME"
          echo "Build: $BUILD"

      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.version.outputs.name }}-build${{ steps.version.outputs.build }}"

          echo "Release tag: $TAG"

          if gh release view "$TAG" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            echo "Release already exists. Replacing APK..."

            gh release upload "$TAG" \
              "build/app/outputs/flutter-apk/app-release.apk" \
              --repo "${{ github.repository }}" \
              --clobber
          else
            echo "Creating new Release..."

            gh release create "$TAG" \
              "build/app/outputs/flutter-apk/app-release.apk" \
              --repo "${{ github.repository }}" \
              --title "Hotel Assistant ${{ steps.version.outputs.name }} Build ${{ steps.version.outputs.build }}" \
              --notes "Automatic APK build. Version ${{ steps.version.outputs.name }}, Build ${{ steps.version.outputs.build }}." \
              --target "${{ github.sha }}"
          fi

          echo "Release URL:"
          gh release view "$TAG" \
            --repo "${{ github.repository }}" \
            --json url \
            --jq '.url'

